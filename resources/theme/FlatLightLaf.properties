# Readora Light - same accent and shapes as Readora Dark, on a cool white surface.

@background = #F3F4FB
@foreground = #16182D
@accentColor = #6D5CFF
@componentBackground = #FFFFFF
@buttonBackground = #FFFFFF
@menuBackground = #FFFFFF
@textBackground = #FFFFFF
@selectionBackground = #DAD5FF
@selectionForeground = #16182D
@disabledForeground = #9A9EBB
@borderColor = #D6D9EC

ToggleButton.selectedBackground = #DAD5FF
ToggleButton.selectedForeground = #16182D
ToggleButton.toolbar.selectedBackground = #DAD5FF
Component.borderColor = @borderColor
Component.focusColor = #6D5CFF
Component.focusedBorderColor = #6D5CFF
Button.borderColor = @borderColor
Button.hoverBackground = #ECEBFF
Button.pressedBackground = #DDDBFF
Button.default.background = #6D5CFF
Button.default.foreground = #FFFFFF
TextField.placeholderForeground = #9A9EBB
Separator.foreground = @borderColor
TableHeader.separatorColor = @borderColor
Table.selectionInactiveBackground = #E6E3FF
List.selectionInactiveBackground = #E6E3FF
ScrollBar.thumb = #C9CCE3
ScrollBar.hoverThumbColor = #AEB2D2
ScrollBar.pressedThumbColor = #6D5CFF
ToolTip.background = #FFFFFF
ToolTip.foreground = #16182D
ToolTip.border = 4,8,4,8,#D6D9EC
Table.gridColor = #E8EAF5
Table.alternateRowColor = #F8F9FE

Button.arc = 16
Component.arc = 16
TextComponent.arc = 16
ProgressBar.arc = 16
CheckBox.arc = 6
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 12
PopupMenu.borderCornerRadius = 12
MenuItem.selectionArc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 0
TitlePane.unifiedBackground = true
