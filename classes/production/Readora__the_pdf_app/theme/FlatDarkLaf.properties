# Readora Dark - palette taken from the app icon:
#   background  #090A12 (icon body)       accent  #6D5CFF (icon violet)
#   gradient    #4FA3FF -> #6D5CFF -> #D060F6 (blue -> violet -> magenta)

@background = #0B0C15
@foreground = #E9EBF8
@accentColor = #6D5CFF
@componentBackground = #11131E
@buttonBackground = #151725
@menuBackground = #11131E
@textBackground = #11131E
@selectionBackground = #342E8C
@selectionForeground = #FFFFFF
@disabledForeground = #5C6080
@borderColor = #2A2D45

ToggleButton.selectedBackground = #342E8C
ToggleButton.selectedForeground = #FFFFFF
ToggleButton.toolbar.selectedBackground = #342E8C
Component.borderColor = @borderColor
Component.focusColor = #6D5CFF
Component.focusedBorderColor = #6D5CFF
Button.borderColor = @borderColor
Button.hoverBackground = #1D2033
Button.pressedBackground = #262A44
Button.default.background = #6D5CFF
Button.default.foreground = #FFFFFF
TextField.placeholderForeground = #6A6E8E
Separator.foreground = @borderColor
TableHeader.separatorColor = @borderColor
Table.selectionInactiveBackground = #2A2670
List.selectionInactiveBackground = #2A2670
ScrollBar.thumb = #2F3350
ScrollBar.hoverThumbColor = #454A72
ScrollBar.pressedThumbColor = #6D5CFF
ToolTip.background = #1B1E31
ToolTip.foreground = #E9EBF8
ToolTip.border = 4,8,4,8,#2A2D45
Table.gridColor = #1B1E31
Table.alternateRowColor = #0E1019

# One shape language everywhere (same numbers as ui.Ui)
Button.arc = 16
Component.arc = 16
TextComponent.arc = 16
ProgressBar.arc = 16
CheckBox.arc = 6
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 12
PopupMenu.borderCornerRadius = 12
MenuItem.selectionArc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 0
TitlePane.unifiedBackground = true
