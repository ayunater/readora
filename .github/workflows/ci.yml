name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build.sh test
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat test
      - name: Upload runnable jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Readora-jar
          path: dist/

  release:
    # Pushing a tag like v1.0.0 attaches the runnable build to a GitHub Release.
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./build.sh
      - name: Package
        run: |
          cd dist && zip -r ../Readora-${GITHUB_REF_NAME}-jar.zip Readora.jar libs
      - uses: softprops/action-gh-release@v2
        with:
          files: Readora-*-jar.zip
          generate_release_notes: true
